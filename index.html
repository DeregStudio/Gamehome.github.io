
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gamehome - Jeux gratuits en ligne</title>

<meta name="description" content="Jouez à nos jeux gratuitement sans les télécharger sur Gamehome.">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #080d19;
    color: #f5f7ff;
}

/* BARRE SUPERIEURE */

header {
    height: 75px;
    background: #101827;
    border-bottom: 1px solid #202c40;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 4%;
    gap: 25px;
}

.logo {
    color: #55c9e8;
    font-size: 26px;
    font-weight: bold;
    text-decoration: none;
    white-space: nowrap;
}

.search-box {
    width: 55%;
    max-width: 650px;
}

.search-box input {
    width: 100%;
    padding: 14px 20px;
    border: 1px solid #26364f;
    border-radius: 30px;
    background: #1a263a;
    color: white;
    outline: none;
    font-size: 14px;
}

.search-box input:focus {
    border-color: #398df5;
}

.header-label {
    color: #9eacc2;
    font-size: 13px;
    white-space: nowrap;
}

/* PRESENTATION */

.hero {
    margin: 30px 4% 20px;
    padding: 30px 20px;
    text-align: center;
    background: linear-gradient(120deg, #142541, #103b49);
    border: 1px solid #263c5c;
    border-radius: 18px;
}

.hero h1 {
    font-size: 30px;
    margin-bottom: 13px;
}

.hero p {
    color: #b6c6dc;
    font-size: 15px;
    line-height: 1.6;
}

/* PUBLICITES */

.ad-container {
    margin: 25px 4% 35px;
}

.ad {
    max-width: 900px;
    min-height: 100px;
    margin: auto;
    background: #152238;
    border: 1px dashed #52627b;
    border-radius: 10px;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #91a2bb;
    font-size: 12px;
    letter-spacing: 1px;
}

/* SECTION DES JEUX */

.games-section {
    padding: 10px 4% 45px;
}

.section-heading {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 22px;
    gap: 10px;
}

.section-heading h2 {
    font-size: 23px;
}

.game-count {
    color: #8fa3c1;
    font-size: 12px;
}

/* GRILLE DES JEUX */

.game-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 20px;
}

/* CARTE */

.game-card {
    background: #111b2c;
    border: 1px solid #25334a;
    border-radius: 13px;
    overflow: hidden;
    transition: transform 0.25s, border-color 0.25s;
    min-width: 0;
}

.game-card:hover {
    transform: translateY(-5px);
    border-color: #398df5;
}

.game-card[hidden] {
    display: none;
}

/* IMAGE */

.game-image {
    width: 100%;
    aspect-ratio: 5 / 4;
    background: #170c39;
    overflow: hidden;
}

.game-image img {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
}

/* INFORMATIONS */

.game-info {
    padding: 16px;
}

.game-info h3 {
    font-size: 17px;
    margin-bottom: 9px;
}

.game-info p {
    color: #aab8cd;
    font-size: 13px;
    line-height: 1.5;
    min-height: 40px;
    margin-bottom: 14px;
}

/* BOUTON */

.play-button {
    display: block;
    width: 100%;
    padding: 12px 8px;
    text-align: center;
    background: #398df5;
    color: white;
    text-decoration: none;
    font-size: 13px;
    font-weight: bold;
    border-radius: 7px;
    transition: background 0.2s;
}

.play-button:hover {
    background: #2474d8;
}

/* MESSAGE DE RECHERCHE */

.no-results {
    display: none;
    text-align: center;
    color: #aab8cd;
    padding: 35px 10px;
}

.no-results.show {
    display: block;
}

/* PIED DE PAGE */

footer {
    background: #101827;
    border-top: 1px solid #25334a;
    padding: 30px 15px;
    text-align: center;
    color: #8fa0b8;
    font-size: 13px;
    line-height: 2;
}

/* PETITS ORDINATEURS */

@media (max-width: 1050px) {
    .game-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
    }
}

/* TABLETTES ET TELEPHONES */

@media (max-width: 650px) {

    header {
        height: auto;
        min-height: 65px;
        padding: 13px 4%;
        flex-wrap: wrap;
        gap: 12px;
    }

    .logo {
        font-size: 22px;
    }

    .header-label {
        font-size: 11px;
    }

    .search-box {
        width: 100%;
        max-width: none;
        order: 3;
    }

    .search-box input {
        padding: 12px 16px;
    }

    .hero {
        margin: 20px 4% 15px;
        padding: 27px 12px;
    }

    .hero h1 {
        font-size: 23px;
    }

    .hero p {
        font-size: 13px;
    }

    .ad-container {
        margin: 20px 4% 27px;
    }

    .ad {
        min-height: 85px;
    }

    .games-section {
        padding: 8px 4% 35px;
    }

    .section-heading h2 {
        font-size: 19px;
    }

    .game-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
    }

    .game-info {
        padding: 11px;
    }
